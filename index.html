<!DOCTYPE html>
<html lang="es">
<head>

  <title>Assistudio — Próximamente</title>
  <meta name="description" content="Assistudio Beauty Studio. Próximamente una nueva experiencia beauty online." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="canonical" href="https://www.assistudio.cl/" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f8f3ef;
      --zinc-900: #18181b;
      --zinc-700: #3f3f46;
      --zinc-500: #71717a;
      --zinc-300: #d4d4d8;
      --zinc-100: #f4f4f5;
      --white: #ffffff;
      --accent: #f1ddd0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--cream);
      color: var(--zinc-900);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow: hidden;
    }

    /* Fondo decorativo */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(241,221,208,0.45) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(241,221,208,0.3) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      text-align: center;
      animation: fadeUp 1s ease both;
    }

    /* Logo / marca */
    .logo {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 0.65rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--zinc-500);
      margin-bottom: 3rem;
      animation: fadeUp 0.8s ease both;
    }

    /* Título principal */
    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3.2rem, 10vw, 5.5rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--zinc-900);
      margin-bottom: 0.4rem;
      animation: fadeUp 0.9s ease 0.1s both;
    }

    .headline em {
      font-style: italic;
      color: var(--zinc-700);
    }

    /* Línea decorativa */
    .divider {
      width: 40px;
      height: 1px;
      background: var(--zinc-300);
      margin: 2rem auto;
      animation: expand 1s ease 0.3s both;
    }

    /* Subtítulo */
    .subtitle {
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--zinc-500);
      line-height: 1.7;
      letter-spacing: 0.02em;
      max-width: 380px;
      margin: 0 auto 2.5rem;
      animation: fadeUp 0.9s ease 0.2s both;
    }

    /* Badge "Próximamente" */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--white);
      border: 1px solid var(--zinc-300);
      border-radius: 100px;
      padding: 0.45rem 1.1rem;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--zinc-700);
      margin-bottom: 2.5rem;
      animation: fadeUp 0.8s ease 0.05s both;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--zinc-900);
      animation: pulse 2s ease infinite;
    }

    /* Botones */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      animation: fadeUp 0.9s ease 0.35s both;
    }

    @media (min-width: 420px) {
      .buttons { flex-direction: row; justify-content: center; }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      border-radius: 100px;
      padding: 0.85rem 1.6rem;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.10);
    }

    .btn-whatsapp {
      background: var(--zinc-900);
      color: var(--white);
    }

    .btn-instagram {
      background: var(--white);
      color: var(--zinc-900);
      border: 1px solid var(--zinc-300);
    }

    .btn-instagram:hover {
      border-color: var(--zinc-500);
    }

    /* Íconos SVG */
    .icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
    }

    /* Footer */
    .footer {
      margin-top: 4rem;
      font-size: 0.7rem;
      color: var(--zinc-500);
      letter-spacing: 0.08em;
      animation: fadeUp 1s ease 0.5s both;
    }

    /* Animaciones */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes expand {
      from { width: 0; opacity: 0; }
      to   { width: 40px; opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

</body>
</html>
